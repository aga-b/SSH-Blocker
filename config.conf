{
  "database": "/var/lib/ssh-guard/state.sqlite3",
  "journal_units": ["ssh.service", "sshd.service"],
  "allowlist": ["127.0.0.0/8", "::1/128"],
  "block_scope": "all",
  "ssh_ports": [22],
  "firewall_table": "ssh_guard",
  "reconcile_seconds": 30,
  "notifications": {
    "digest_interval_seconds": 3600,
    "thresholds": [10, 50, 100],
    "threshold_cooldown_seconds": 300,
    "poll_seconds": 2,
    "retry_seconds": 60,
    "send_empty_digest": false
  },
  "smtp": {
    "enabled": true,
    "host": "smtp.example.com",
    "port": 587,
    "mode": "starttls",
    "from_addr": "ssh-guard@example.com",
    "recipients": ["admin@example.com"],
    "username": "ssh-guard@example.com",
    "password_env": "SSH_GUARD_SMTP_PASSWORD",
    "timeout_seconds": 15,
    "subject_prefix": "SSH Guard"
  }
}
